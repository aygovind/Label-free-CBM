# The standard LF-CBM pipeline from the paper: a CLIP backbone interpreted through
# its own CLIP concept space. This is the reference recipe BioCLIP is being compared
# against -- unlike rn50_birds525 it holds architecture fixed (ViT-B/16), so the only
# difference from bioclip_birds525 is the pretraining data.
#
# NOTE: requires the "backbone_" cache-key marker in utils.get_save_names. Without it
# --backbone clip_ViT-B/16 --clip_name ViT-B/16 aliases both caches to one file.
dataset: birds525
concept_set: data/concept_sets/birds525_filtered.txt
backbone: clip_ViT-B/16
clip_name: ViT-B/16
feature_layer: unused        # clip_-prefixed backbones use encode_image, not a hook

batch_size: 256
clip_cutoff: 0.2
interpretability_cutoff: 0.3
print: true
